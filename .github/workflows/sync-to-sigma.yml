name: Sync Data Models to Sigma

on:
  push:
    branches: [main]
    paths:
      - 'data-models/*.json'
      - 'workbooks/*.json'
  pull_request:
    branches: [main]
    paths:
      - 'data-models/*.json'
      - 'workbooks/*.json'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Sync all data models (not just changed ones)'
        required: false
        default: 'false'
        type: boolean

env:
  SIGMA_CLIENT_ID: ${{ secrets.SIGMA_CLIENT_ID }}
  SIGMA_SECRET: ${{ secrets.SIGMA_SECRET }}

jobs:
  # ── 1. JSON syntax check (unchanged) ─────────────────────────────────────────
  validate:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "Validating data model and workbook JSON files..."
          for file in data-models/*.json workbooks/*.json; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              python3 -m json.tool "$file" > /dev/null || exit 1
            fi
          done
          echo "✅ All JSON files are valid"

      - name: Lint action identifier fields (Sigma 2026-08-26 rename)
        # json.tool above checks SYNTAX only. Every spec here was pulled
        # 2026-08-05, before Sigma renamed action identifier fields to a *Id
        # shape, so a pushed spec can carry a dead key. Most 400 -- but
        # clear-control scope `page` returns 200 OK, drops the key, and the
        # button silently clears nothing, so a status check cannot catch it.
        run: python3 scripts/lint_action_fields.py

  # ── 2. Sigma CI — drift + blast radius (PRs only) ────────────────────────────
  sigma-validate:
    name: "Sigma CI — Drift & Blast Radius"
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Resolve model IDs for changed files
        id: models
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'data-models/*.json' \
            | grep -v '_template.json' \
            | xargs -I{} basename {} \
            | tr '\n' ' ')

          if [ -z "$CHANGED" ]; then
            echo "model_ids=" >> "$GITHUB_OUTPUT"
            echo "No changed data model files found — skipping sigma-ci"
            exit 0
          fi

          MODEL_IDS=$(python3 scripts/get_model_ids.py $CHANGED)
          echo "model_ids=$MODEL_IDS" >> "$GITHUB_OUTPUT"

          if [ -z "$MODEL_IDS" ]; then
            echo "⚠️  Changed files not yet mapped in config.yml (new models). Skipping sigma-ci."
          else
            echo "Validating model IDs: $MODEL_IDS"
          fi

      - name: Run Sigma CI validation
        id: sigma-ci
        if: steps.models.outputs.model_ids != ''
        uses: twells89/sigma-ci@main
        with:
          sigma-client-id: ${{ secrets.SIGMA_CLIENT_ID }}
          sigma-client-secret: ${{ secrets.SIGMA_SECRET }}
          model-ids: ${{ steps.models.outputs.model_ids }}
          fail-on-drift: 'true'

      - name: Post validation result as PR comment
        # Run even when sigma-ci fails (drift detected) so the PR shows the report
        if: always() && steps.models.outputs.model_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_DRIFT: ${{ steps.sigma-ci.outputs.has-drift }}
          SIGMA_REPORT: ${{ steps.sigma-ci.outputs.report-markdown }}
        run: |
          if [ "$HAS_DRIFT" = "true" ]; then
            HEADER="## ❌ Sigma CI — Drift Detected (merge blocked)"
          else
            HEADER="## ✅ Sigma CI — Validation Passed"
          fi

          {
            echo "$HEADER"
            echo ""
            echo "$SIGMA_REPORT"
            echo ""
            echo "---"
            echo "*Validated by [sigma-ci](https://github.com/twells89/sigma-ci)*"
          } > sigma_ci_comment.md

          gh pr comment "${{ github.event.pull_request.number }}" --body-file sigma_ci_comment.md

  # ── 3. Spec diff report (PRs only, unchanged) ────────────────────────────────
  diff-report:
    name: Generate Diff Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate and post diff report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/generate_diff_report.py > diff_report.md 2> diff_debug.log
          cat diff_debug.log >&2

          if [ -s diff_report.md ] && ! grep -q "No data model changes detected" diff_report.md; then
            {
              echo "## 📊 Data Model Changes"
              echo ""
              cat diff_report.md
            } > comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          fi

  # ── 4. Sync to Sigma (push / manual only) ────────────────────────────────────
  sync:
    name: Sync to Sigma
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Sync changed files to Sigma
        run: |
          # Collect changed files into bash arrays. Keeping them in arrays (not a
          # space-joined string spliced into the command line) means filenames
          # with "(", "&" or spaces, e.g. "channel-report-(qlik)-sigma.json", are
          # passed safely instead of being parsed as shell syntax.
          # --diff-filter=ACMR skips deletions, which have nothing to sync.
          CHANGED=(); CHANGED_WB=()
          if [ "${{ github.event.inputs.sync_all }}" == "true" ]; then
            while IFS= read -r f; do CHANGED+=("$f");    done < <(ls data-models/*.json 2>/dev/null | grep -v '_template.json')
            while IFS= read -r f; do CHANGED_WB+=("$f"); done < <(ls workbooks/*.json   2>/dev/null | grep -v '_template.json')
          else
            while IFS= read -r f; do CHANGED+=("$f");    done < <(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- 'data-models/*.json' | grep -v '_template.json')
            while IFS= read -r f; do CHANGED_WB+=("$f"); done < <(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- 'workbooks/*.json'   | grep -v '_template.json')
          fi
          echo "Changed data models: ${CHANGED[*]:-(none)}"
          echo "Changed workbooks:   ${CHANGED_WB[*]:-(none)}"

          if [ ${#CHANGED[@]} -gt 0 ]; then
            python scripts/sync_to_sigma.py "${CHANGED[@]}"
          fi
          if [ ${#CHANGED_WB[@]} -gt 0 ]; then
            python scripts/sync_workbooks_to_sigma.py "${CHANGED_WB[@]}"
          fi

      - name: Commit updates from Sigma
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z $(git status --porcelain config.yml data-models/ workbooks/) ]]; then
            echo "✅ No changes to commit"
            exit 0
          fi

          git pull --rebase origin main || true
          git add config.yml data-models/ workbooks/
          git commit -m "chore: Sync versions from Sigma [skip ci]"

          for i in {1..3}; do
            if git push origin main; then
              echo "✅ Pushed successfully"
              exit 0
            fi
            git pull --rebase origin main || true
          done
          echo "⚠️  Could not push after 3 attempts (non-critical)"
