name: Pull Changes from Sigma

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create PR for changes (vs direct commit)'
        required: false
        default: 'true'
        type: boolean
      include_workbooks:
        description: 'Also pull spec-created workbooks (overrides config for this run)'
        required: false
        default: 'false'
        type: boolean

jobs:
  pull-from-sigma:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Pull latest from Sigma
        env:
          SIGMA_CLIENT_ID: ${{ secrets.SIGMA_CLIENT_ID }}
          SIGMA_SECRET: ${{ secrets.SIGMA_SECRET }}
        run: python scripts/pull_from_sigma.py

      # Optional: refresh spec-created workbooks. Self-gates on
      # `manage_workbooks: true` in config.yml; a manual dispatch with
      # include_workbooks=true forces it on for a single run.
      - name: Pull workbooks from Sigma (spec-created only)
        env:
          SIGMA_CLIENT_ID: ${{ secrets.SIGMA_CLIENT_ID }}
          SIGMA_SECRET: ${{ secrets.SIGMA_SECRET }}
          FORCE_WORKBOOKS: ${{ github.event.inputs.include_workbooks }}
        run: python scripts/pull_workbooks_from_sigma.py

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain data-models/ workbooks/) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            CHANGED_LIST=$(git status --porcelain data-models/ workbooks/ | awk '{print $2}' | xargs -I{} basename {} | tr '\n' '\n')
            echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED_LIST" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "🔄 Changes detected"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ No changes from Sigma"
          fi

      # Run sigma-ci drift check across all models after pulling
      - name: Run Sigma CI drift check
        id: sigma-ci
        if: steps.changes.outputs.has_changes == 'true'
        uses: twells89/sigma-ci@main
        with:
          sigma-client-id: ${{ secrets.SIGMA_CLIENT_ID }}
          sigma-client-secret: ${{ secrets.SIGMA_SECRET }}
          model-ids: ''        # empty = validate all models
          fail-on-drift: 'false'   # don't block the PR; just surface the info

      - name: Build PR body
        id: pr-body
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SIGMA_REPORT: ${{ steps.sigma-ci.outputs.report-markdown }}
          HAS_DRIFT: ${{ steps.sigma-ci.outputs.has-drift }}
        run: |
          {
            echo "## 📄 Data model changes pulled from Sigma"
            echo ""
            echo "The following files were updated by the daily sync:"
            echo ""
            echo '```'
            echo "${{ steps.changes.outputs.changed_files }}"
            echo '```'
            echo ""
            echo "Review these changes before merging. If they conflict with local work, merge manually."
            echo ""

            if [ -n "$SIGMA_REPORT" ]; then
              echo "---"
              echo ""
              echo "## Sigma CI — Model Health"
              echo ""
              # GitHub caps PR bodies at 65536 characters; a large drift report
              # (many models, many broken references) can exceed that on its own
              # and fail PR creation outright (run 30990020275, 2026-08-05).
              # Truncate defensively and point at the full report in the run logs.
              REPORT_LIMIT=40000
              if [ "${#SIGMA_REPORT}" -gt "$REPORT_LIMIT" ]; then
                echo "${SIGMA_REPORT:0:$REPORT_LIMIT}"
                echo ""
                echo "_… truncated ($(( ${#SIGMA_REPORT} - REPORT_LIMIT )) more characters.
          See the [full drift report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in this run's logs (\"Run Sigma CI drift check\" step)._"
              else
                echo "$SIGMA_REPORT"
              fi
              echo ""
              if [ "$HAS_DRIFT" = "true" ]; then
                echo "> ⚠️  **Schema drift found.** Consider fixing drift before merging."
              fi
            fi

            echo "---"
            echo ""
            echo "_Automatically created by the Pull Changes from Sigma workflow._"
          } > pr_body.md

          # Final defensive backstop in case other sections (e.g. a very large
          # changed-files list) also grow unbounded over time.
          BODY_LIMIT=60000
          if [ "$(wc -c < pr_body.md)" -gt "$BODY_LIMIT" ]; then
            head -c "$BODY_LIMIT" pr_body.md > pr_body.trunc.md
            printf '\n\n_… body truncated to fit GitHub'"'"'s PR size limit. See the [full run](%s/%s/actions/runs/%s) for complete output._\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" >> pr_body.trunc.md
            mv pr_body.trunc.md pr_body.md
          fi

          echo "body_file=pr_body.md" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && github.event.inputs.create_pr != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sigma-sync/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data-models/ workbooks/ config.yml
          git commit -m "sync: Pull latest changes from Sigma"
          git push origin "$BRANCH"

          gh pr create \
            --title "📄 Sync: Data model changes from Sigma" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH" \
            --label "automated,sigma-sync"

      - name: Direct commit (if PR disabled)
        if: steps.changes.outputs.has_changes == 'true' && github.event.inputs.create_pr == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-models/ workbooks/ config.yml
          git commit -m "sync: Pull latest changes from Sigma"
          git push
